name: Deploy page
on: 
  push:
    branches:
      - src
permissions:
  contents: write
jobs:
  itdubeploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies 📦
        run: bun install

      - name: Build 🛠️
        env:
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL || 'https://cv-sv.pritamdey.in' }}
        run: bun run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/
          branch: gh-pages